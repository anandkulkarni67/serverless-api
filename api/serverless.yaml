AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AWS SAM template for a a serverless API

Resources:
  HelloWorldFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../../api
      Handler: ./dist/index.handler
      Runtime: nodejs22.x
      Policies: AmazonAPIGatewayInvokeFullAccess
      Events:
        HelloWorldApi:
          Type: Api
          Properties:
            Path: /
            Method: GET
            RestApiId: !Ref HelloWorldApiGateway

  HelloWorldApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      # Optional: Add CORS configuration if needed
      # Cors:
      #   AllowOrigin: "'*'"
      #   AllowMethods: "'GET,POST,PUT,DELETE'"

Outputs:
  ApiEndpoint:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${HelloWorldApiGateway}.execute-api.${AWS::Region}://"